name: Generate tests from Jira AC and push + link

on:
  workflow_dispatch:
    inputs:
      story_key:
        description: 'Jira story key'
        required: true
        default: 'SCRUM-1'

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # 1) Ensure JIRA_API_TOKEN exists
      - name: Check Jira token present (length only)
        shell: bash
        env:
          JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
        run: |
          if [ -z "${JIRA_API_TOKEN}" ]; then
            echo "JIRA_API_TOKEN is EMPTY. Add it in Repo Settings → Secrets and rerun."; exit 1
          fi
          echo "JIRA_API_TOKEN length: ${#JIRA_API_TOKEN}"

      # 2) Diagnose auth + visibility
      - name: Diagnose Jira auth + visibility
        shell: bash
        env:
          JIRA_BASE_URL: "https://altimetrikjiraaccess.atlassian.net"
          JIRA_EMAIL: "altimetrikjiraaccess@gmail.com"
          JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
          STORY_KEY: ${{ github.event.inputs.story_key }}
        run: |
          set -e
          echo "Check /myself:"
          curl -sS -u "${JIRA_EMAIL}:${JIRA_API_TOKEN}" -H 'Accept: application/json' \
            "${JIRA_BASE_URL}/rest/api/3/myself" | head -c 400; echo
          echo "Search SCRUM-1:"
          curl -sS -u "${JIRA_EMAIL}:${JIRA_API_TOKEN}" \
            -G --data-urlencode "jql=issueKey=${STORY_KEY}" \
            "${JIRA_BASE_URL}/rest/api/3/search?fields=summary" | head -c 400; echo

      # 3) Generate Python test files from AC and create/link Jira Test issues
      - name: Run generator (no external deps)
        env:
          JIRA_BASE_URL: "https://altimetrikjiraaccess.atlassian.net"
          JIRA_EMAIL: "altimetrikjiraaccess@gmail.com"
          JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
          STORY_KEY: ${{ github.event.inputs.story_key }}
          AC_FIELD_ID: "customfield_10059"
          # Optional: set an OpenAI API key to enable LLM rewrite
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          # Optional: override model if you want
          OPENAI_MODEL: "gpt-4.1-mini"
          TEST_ISSUE_TYPE: "Test"
          ISSUE_LINK_TYPE: "Relates"
          GIT_AUTHOR_NAME: "codex-bot"
          GIT_AUTHOR_EMAIL: "codex-bot@users.noreply.github.com"
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          python - <<'PY'
          import base64, json, os, pathlib, re, sys, urllib.parse, urllib.request

          # ------------------- Config -------------------
          JIRA_BASE   = os.environ["JIRA_BASE_URL"].rstrip("/")
          JIRA_EMAIL  = os.environ["JIRA_EMAIL"]
          JIRA_TOKEN  = os.environ["JIRA_API_TOKEN"]
          STORY_KEY   = os.environ.get("STORY_KEY", "SCRUM-1")
          AC_FIELD_ID = os.environ.get("AC_FIELD_ID", "customfield_10059")
          OAI_KEY     = os.environ.get("OPENAI_API_KEY") or ""
          OAI_MODEL   = os.environ.get("OPENAI_MODEL", "gpt-4.1-mini")
          TEST_TYPE   = os.environ.get("TEST_ISSUE_TYPE", "Test")
          LINK_TYPE   = os.environ.get("ISSUE_LINK_TYPE", "Relates")

          # ------------------- HTTP helpers -------------------
          def _auth_header():
              b = base64.b64encode(f"{JIRA_EMAIL}:{JIRA_TOKEN}".encode()).decode()
              return {
                  "Authorization": f"Basic {b}",
                  "Accept": "application/json",
                  "Content-Type": "application/json",
              }

          def http_get(url, headers=None):
              h=_auth_header();
              if headers: h.update(headers)
              req = urllib.request.Request(url, headers=h, method="GET")
              with urllib.request.urlopen(req, timeout=60) as r:
                  return r.status, r.read().decode()

          def http_post(url, payload_dict, headers=None):
              h = _auth_header(); h["Content-Type"] = "application/json"
              if headers: h.update(headers)
              body = json.dumps(payload_dict).encode()
              req = urllib.request.Request(url, headers=h, data=body, method="POST")
              with urllib.request.urlopen(req, timeout=60) as r:
                  return r.status, r.read().decode()

          def http_put(url, payload_dict, headers=None):
              h = _auth_header(); h["Content-Type"] = "application/json"
              if headers: h.update(headers)
              body = json.dumps(payload_dict).encode()
              req = urllib.request.Request(url, headers=h, data=body, method="PUT")
              with urllib.request.urlopen(req, timeout=60) as r:
                  return r.status, r.read().decode()    
                  
          # ------------------- Jira helpers -------------------
          def get_story_with_ac(key):
              url = f"{JIRA_BASE}/rest/api/3/issue/{key}?fields=" + urllib.parse.quote(f"summary,{AC_FIELD_ID}")
              code, text = http_get(url)
              if code != 200:
                  raise RuntimeError(f"GET issue failed: {code} {text[:400]}")
              js = json.loads(text)
              summary = js["fields"].get("summary", "(no summary)")
              ac_node = js["fields"].get(AC_FIELD_ID)
              return summary, ac_node

           def search_issue(jql, fields="key,summary"):
              url = f"{JIRA_BASE}/rest/api/3/search?{urllib.parse.urlencode({'jql': jql, 'fields': fields})}"
              code, txt = http_get(url)
              if code != 200:
                  raise RuntimeError(f"Search failed {code}: {txt[:400]}")
              return json.loads(txt).get("issues", [])

          def ensure_link(child_key, parent_key):
              payload = {"type":{"name":"Relates"}, "inwardIssue":{"key":child_key}, "outwardIssue":{"key":parent_key}}
              try:
                  http_post(f"{JIRA_BASE}/rest/api/3/issueLink", payload)
              except Exception:
                  pass

          def add_comment(issue_key, body_text):
              payload = {"body": body_text}
              http_post(f"{JIRA_BASE}/rest/api/3/issue/{issue_key}/comment", payload)

          def set_description_if_empty(issue_key, body_text):
              code, txt = http_get(f"{JIRA_BASE}/rest/api/3/issue/{issue_key}?fields=description")
              js = json.loads(txt)
              if js["fields"].get("description") is None:
                  http_put(f"{JIRA_BASE}/rest/api/3/issue/{issue_key}", {"fields": {"description": body_text}})

            # ------------------- AC normalization -------------------
          bullet_re = re.compile(r"^\s*([•*\-\d\)]+)\s*", re.MULTILINE)
          
          def flatten_adf(val):
              def walk(n, out):
                  if isinstance(n, dict):
                      if n.get("type") == "text":
                          t = n.get("text","")
                          if t: out.append(t)
                      for k in ("content","items"):
                          if k in n: walk(n[k], out)
                  elif isinstance(n, list):
                      for c in n: walk(c, out)
              buf=[]; walk(val, buf)
              return "".join(buf)

          def normalize_blocks(val):
              if val is None: return []
              if isinstance(val, dict): txt = flatten_adf(val)
              elif isinstance(val, list): txt = "\n".join(str(x or "") for x in val)
              else: txt = str(val)
              items=[]
              for p in re.split(r"\r?\n", txt):
                  t = bullet_re.sub("", p).strip()
                  if t: items.append(t)
              return items


       # ------------------- LLM (optional) -------------------
          def llm_gherkin(ac_text, title):
              """
              Use OpenAI Responses API to produce clean Given/When/Then steps.
              Falls back to rule-based if key missing or any error occurs.
              """
              if not OAI_KEY:
                  return None
              try:
                  # Lazy import; pip not required because we use stdlib here. We'll shell-install openai in the step if desired.
                  import json, http.client as _hc, ssl as _ssl, os as _os
                  # Minimal HTTP call to OpenAI v1 Responses API to avoid extra deps.
                  # You can swap this with `openai` SDK if you prefer (pip install openai).
                  host = "api.openai.com"
                  conn = _hc.HTTPSConnection(host, context=_ssl.create_default_context())
                  prompt = (
                      "Rewrite the acceptance criterion into a concise Gherkin scenario.\n"
                      "Return ONLY:\n"
                      "Scenario: <short title>\n"
                      "Given ...\nWhen ...\nThen ...\n"
                      "Keep steps specific, testable, deterministic. Avoid UI fluff.\n\n"
                      f"Acceptance Criterion:\n{ac_text}\n"
                  )
                  body = json.dumps({
                      "model": OAI_MODEL,
                      "input": prompt,
                      "temperature": 0.2,
                  })
                  headers = {
                      "Authorization": f"Bearer {OAI_KEY}",
                      "Content-Type": "application/json",
                  }
                  conn.request("POST", "/v1/responses", body=body, headers=headers)
                  resp = conn.getresponse()
                  data = resp.read().decode()
                  if resp.status != 200:
                      return None
                  j = json.loads(data)
                  # The python SDK exposes response.output_text; raw REST returns candidates.
                  # Try common shapes defensively:
                  text = (
                      j.get("output_text")
                      or j.get("content")
                      or j.get("response", {}).get("output_text")
                  )
                  if not text:
                      # dig into top-level 'output' (older shape)
                      out = j.get("output") or j.get("choices") or []
                      if isinstance(out, list) and out:
                          # heuristically grab text
                          text = out[0].get("content") or out[0].get("text")
                  if not text:
                      return None
                  text = str(text).strip()
                  # Ensure title prefix
                  if not text.lower().startswith("scenario:"):
                      text = f"Scenario: {title}\n{text}"
                  return text
              except Exception:
                  return None

          def rule_gherkin(ac_text, title):
              has_kw = re.search(r"\b(Given|When|Then|And|But)\b", ac_text, re.I)
              if has_kw:
                  # Normalize casing & line breaks
                  body = re.sub(r"\s*(Given|When|Then|And|But)\s*", lambda m: "\n"+m.group(1).title()+" ", ac_text, flags=re.I).strip()
                  return f"Scenario: {title}\n{body}\n"
              return (
                  f"Scenario: {title}\n"
                  "Given the system is ready\n"
                  "When the user performs the described action\n"
                  f"Then {ac_text}\n"
              )

          # ------------------- Main -------------------
          story_summary, ac_val = get_story_with_ac(STORY_KEY)
          ac_items = normalize_blocks(ac_val) or ["No Acceptance Criteria provided."]

          feat_dir = pathlib.Path("tests/generated") / STORY_KEY / "gherkin"
          feat_dir.mkdir(parents=True, exist_ok=True)
          feature_path = feat_dir / f"{STORY_KEY.lower()}_ac.feature"

          lines = [f"Feature: {STORY_KEY} — {story_summary}\n"]
          for i, ac in enumerate(ac_items, start=1):
              title = f"{STORY_KEY} - AC {i}"
              g = llm_gherkin(ac, title) or rule_gherkin(ac, title)
              lines.append(g)

              # Update matching Jira Test
              jql = f'project="{STORY_KEY.split("-")[0]}" AND summary~"[Auto-Test] {STORY_KEY} - AC {i}" ORDER BY created DESC'
              found = search_issue(jql, fields="key")
              if not found:
                  print(f"WARNING: No matching Test issue for AC {i}")
                  continue
              test_key = found[0]["key"]
              comment = f"*Auto-generated Gherkin for {STORY_KEY} AC {i}:*\n\n{g}"
              add_comment(test_key, comment)
              set_description_if_empty(test_key, g)
              ensure_link(test_key, STORY_KEY)
              print(f"Updated {test_key} with Gherkin and ensured link")

          feature_path.write_text("\n".join(lines), encoding="utf-8")
          print("Wrote feature:", feature_path)
          PY

          # Commit .feature file if changed
          git add tests/generated/**/gherkin/*.feature || true
          if git diff --cached --quiet; then
            echo "No Gherkin changes to commit."
          else
            git -c user.name="codex-bot" -c user.email="codex-bot@users.noreply.github.com" commit -m "chore(tests): add LLM Gherkin scenarios for ${STORY_KEY}"
            git push origin HEAD
          fi
