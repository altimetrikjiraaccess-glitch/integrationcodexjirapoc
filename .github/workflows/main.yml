- name: Diagnose Jira auth + visibility
  shell: bash
  env:
    JIRA_BASE_URL: "https://altimetrikjiraaccess.atlassian.net"
    JIRA_EMAIL: "altimetrikjiraaccess@gmail.com"
    JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
    STORY_KEY: ${{ github.event.inputs.story_key }}
  run: |
    set -e
    echo "Jira base: $JIRA_BASE_URL"
    echo "Runner egress IP:"
    curl -s https://ifconfig.me || true; echo

    echo "Check /myself:"
    curl -sS -u "${JIRA_EMAIL}:${JIRA_API_TOKEN}" \
      -H 'Accept: application/json' \
      "${JIRA_BASE_URL}/rest/api/3/myself" | python - <<'PY'
import sys, json
j = json.load(sys.stdin)
print(" accountId:", j.get("accountId"))
print(" displayName:", j.get("displayName"))
print(" emailAddress:", j.get("emailAddress","(redacted)"))
PY

    echo "Search for the issue by JQL:"
    curl -sS -u "${JIRA_EMAIL}:${JIRA_API_TOKEN}" \
      -G --data-urlencode "jql=issueKey=${STORY_KEY}" \
      "${JIRA_BASE_URL}/rest/api/3/search?fields=summary" | python - <<'PY'
import sys, json
j = json.load(sys.stdin)
print(" total:", j.get("total"), "| issues:", [i["key"] for i in j.get("issues",[])])
if j.get("issues"):
    print(" summary:", j["issues"][0]["fields"].get("summary"))
PY

    echo "Direct GET (fields=summary):"
    curl -sS -i -u "${JIRA_EMAIL}:${JIRA_API_TOKEN}" \
      -H 'Accept: application/json' \
      "${JIRA_BASE_URL}/rest/api/3/issue/${STORY_KEY}?fields=summary" | head -n 20
